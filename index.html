      html {
        scroll-behavior: auto; /* Let Lenis handle scrolling */

      body {
        font-family: 'Poppins', sans-serif;
        background-color: #020202; /* Darker background */

        font-weight: 400;
        margin: 0;

      /* --- CUSTOM SCROLLBAR UI --- */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
        border: 2px solid transparent;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* Firefox Scrollbar Support */
      @supports (scrollbar-color: auto) {
        * {
          scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
          scrollbar-width: thin;
        }
      }
      
      h1, h2, h3, .font-display {
        font-family: 'Unbounded', 'Milker', 'Syne', sans-serif;

      .glass-panel {
        background: rgba(20, 20, 20, 0.6);

        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);

      .glass-input {

        border: 1px solid rgba(255, 255, 255, 0.1);

        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      .glass-element:hover {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1.1); opacity: 0.2; }
        50% { transform: scale(1.2); opacity: 0.3; }
      }
      .animate-breathe {
        animation: breathe 10s ease-in-out infinite;
      }

      @keyframes text-reveal {
        0% { opacity: 0; filter: blur(12px); transform: translateY(10px); }
        100% { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      .animate-text-reveal {
        animation: text-reveal 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      }

      /* Marquee Animations for Hero Section */
      @keyframes marquee-up {
        0% { transform: translateY(0); }
        100% { transform: translateY(-50%); }
      }
      @keyframes marquee-down {
        0% { transform: translateY(-50%); }
        100% { transform: translateY(0); }

      const ToastContext = createContext(null);
      const ToastProvider = ({ children }) => {
        const [toasts, setToasts] = useState([]);
        const addToast = (message, type = 'success', duration = 5000) => {
          const id = Date.now();
          setToasts(prev => [...prev, { id, message, type }]);
          setTimeout(() => removeToast(id), duration);
        };
        const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));
        return (
          <ToastContext.Provider value={{ addToast }}>
            {children}
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 md:translate-x-0 md:left-auto md:bottom-6 md:right-6 z-[200] flex flex-col gap-3 pointer-events-none w-full max-w-[calc(100%-32px)] md:max-w-sm">

                  <p className="text-sm font-medium leading-tight">{toast.message}</p>
                  <button onClick={() => removeToast(toast.id)} className="ml-auto opacity-50 hover:opacity-100 transition-opacity p-1"><X size={14} /></button>
                </div>
              ))}
            </div>
          </ToastContext.Provider>
        );
      };
      const useToast = () => useContext(ToastContext);

      const mapFromDb = (row) => ({
        id: row.id, title: row.title, prompt: row.prompt, imageUrl: row.image_url, category: row.category, createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now()
      });
      const mapToDb = (data) => ({
        id: data.id, title: data.title, prompt: data.prompt, image_url: data.imageUrl, category: data.category, created_at: new Date(data.createdAt).toISOString()
      });

      const fetchPrompts = async () => {
        const { data, error } = await supabase.from('prompts').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        return data.map(mapFromDb);
      };
      const checkDatabaseHealth = async () => {
        try {
          const { data, error } = await supabase.from('prompts').select('id').limit(1);
          return { healthy: !error, error: error?.message };
        } catch (e) { return { healthy: false, error: e.message }; }
      };
      const uploadImageToSupabase = async (file) => {
        const fileName = `${Date.now()}-${Math.random().toString(36).substring(2, 9)}.${file.name.split('.').pop()}`;
        const { data, error } = await supabase.storage.from('images').upload(fileName, file);
        if (error) throw error;
        return supabase.storage.from('images').getPublicUrl(fileName).data.publicUrl;
      };
      const savePromptToSupabase = async (p) => { await supabase.from('prompts').upsert(mapToDb(p)); };
      const deletePromptFromSupabase = async (id) => { await supabase.from('prompts').delete().eq('id', id); };
      const encodeShareData = (d) => btoa(unescape(encodeURIComponent(JSON.stringify(d))));
      const decodeShareData = (e) => { try { return JSON.parse(decodeURIComponent(escape(atob(e)))); } catch { return null; } };

      const Button = ({ children, variant = 'primary', fullWidth = false, className = '', ...props }) => {
        const variants = {
          primary: "bg-[#547EAE] hover:bg-[#4a4aff] text-white rounded-full px-6 py-3 shadow-[0_0_20px_-5px_#547EAE]",
          secondary: "bg-white text-black hover:bg-gray-200 rounded-full px-6 py-3",
          ghost: "bg-transparent text-white/70 hover:text-white hover:bg-white/10 rounded-lg p-2",
          icon: "bg-white/10 hover:bg-white/20 text-white rounded-full p-2 backdrop-blur-md",
          danger: "bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 rounded-full px-4 py-3 border border-red-500/20"
        };
        return <button className={`inline-flex items-center justify-center transition-all duration-200 font-medium tracking-wide disabled:opacity-50 select-none active:scale-[0.98] ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${className}`} {...props}>{children}</button>;
      };

      const HeroSection = ({ prompts }) => {
        const pool = prompts && prompts.length > 0 ? prompts : Array.from({length: 12}).fill(null);
        const items = [...pool, ...pool, ...pool, ...pool, ...pool, ...pool, ...pool, ...pool].slice(0, 80);

                          {[...colItems, ...colItems].map((p, i) => (

                                 <img src={p ? p.imageUrl : `https://picsum.photos/seed/${colIndex * 100 + i}/400/500`} className="w-full h-full object-cover" loading="lazy" alt="" />

                          ))}
                      </div>
                  ))}
              </div>
              <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
              <div className="absolute inset-0 flex flex-col items-start justify-end z-10 p-8 pb-12 md:pb-16 text-left">
                   <h1 className="font-display font-black text-3xl md:text-5xl tracking-tighter leading-[0.85] text-white drop-shadow-2xl flex flex-col">
                      <span>STAY WAVY</span><span className="text-white/90">PROMPT SMARTER</span>
                   </h1>
                   <p className="text-white/50 text-[10px] md:text-xs font-medium max-w-xs mt-4 tracking-wide">Discover and collect AI prompts in your personal vault.</p>
              </div>
          </div>
        );
      };

      const PromptCard = ({ data, onClick, onEdit }) => {
        const [copied, setCopied] = useState(false);
        const { addToast } = useToast();
        const category = data.category || 'NanoBanana';

        const handleShare = (e) => {
          e.stopPropagation();
          const url = `${window.location.origin}${window.location.pathname}#/share/${encodeShareData(data)}`;
          navigator.clipboard.writeText(url).then(() => {
            setCopied(true);
            addToast("Link copied!");
            setTimeout(() => setCopied(false), 2000);
          });
        };

        const getDotColor = (c) => {
          if (c === 'NanoBanana') return 'bg-[#FFD700]';
          if (c === 'Midjourney') return 'bg-[#00BFFF]';
          return 'bg-[#00FA9A]';
        };

        return (

                  <button onClick={handleShare} className={`glass-element w-9 h-9 flex items-center justify-center rounded-full transition-all border border-white/5 ${copied ? 'bg-white text-black' : 'text-white/50 hover:text-white'}`}>{copied ? <Check size={14} /> : <Share2 size={14} />}</button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const AddModal = ({ isOpen, onClose, onSave, onDelete, initialData }) => {
        const [title, setTitle] = useState('');
        const [prompt, setPrompt] = useState('');
        const [imageMode, setImageMode] = useState('upload');
        const [imageUrl, setImageUrl] = useState('');
        const [selectedFile, setSelectedFile] = useState(null);
        const [previewUrl, setPreviewUrl] = useState('');
        const [category, setCategory] = useState('NanoBanana');
        const [isSaving, setIsSaving] = useState(false);
        const fileInputRef = useRef(null);
        const { addToast } = useToast();

        useEffect(() => {
          if (isOpen) {
            if (initialData) {
              setTitle(initialData.title); setPrompt(initialData.prompt); setImageUrl(initialData.imageUrl); setPreviewUrl(initialData.imageUrl); setImageMode('link'); setCategory(initialData.category || 'NanoBanana');
            } else {
              setTitle(''); setPrompt(''); setImageUrl(''); setPreviewUrl(''); setImageMode('upload'); setCategory('NanoBanana');
            }
            setSelectedFile(null);
          }
        }, [isOpen, initialData]);

        const handleFileChange = (e) => {
          const file = e.target.files[0];
          if (file) { setSelectedFile(file); setPreviewUrl(URL.createObjectURL(file)); }
        };

        if (!isOpen) return null;

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (isSaving) return;
          setIsSaving(true);
          try {
            const baseData = { id: initialData?.id || Date.now().toString(), title, prompt, imageUrl: imageMode === 'link' ? imageUrl : (initialData?.imageUrl || ''), category, createdAt: initialData?.createdAt || Date.now() };
            await onSave(baseData, (imageMode === 'upload' && selectedFile) ? selectedFile : null);
            addToast(initialData ? "Vault entry updated!" : "Saved to Vault!");
            onClose();
          } catch (err) { addToast(err.message, "error"); } finally { setIsSaving(false); }

        return (

                </div>
                <div className="space-y-2">
                  <div className="flex gap-2"><button type="button" onClick={() => setImageMode('upload')} className={`text-[10px] font-black uppercase px-3 py-1.5 rounded-lg ${imageMode === 'upload' ? 'bg-[#547EAE] text-white' : 'text-white/30'}`}>Upload</button><button type="button" onClick={() => setImageMode('link')} className={`text-[10px] font-black uppercase px-3 py-1.5 rounded-lg ${imageMode === 'link' ? 'bg-[#547EAE] text-white' : 'text-white/30'}`}>URL</button></div>
                  {imageMode === 'upload' ? (
                     <div onClick={() => fileInputRef.current?.click()} className="group relative w-full aspect-[4/5] max-h-[160px] rounded-xl border-2 border-dashed border-white/10 bg-white/5 flex flex-col items-center justify-center cursor-pointer overflow-hidden">

                      <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleFileChange} />
                     </div>
                  ) : (
                    <input type="url" value={imageUrl} onChange={(e) => { setImageUrl(e.target.value); setPreviewUrl(e.target.value); }} placeholder="https://..." className="glass-input w-full rounded-xl px-4 py-3 text-sm" />
                  )}
                </div>
                <div><label className="text-xs text-white/40 uppercase font-black ml-1">Prompt</label><textarea required value={prompt} onChange={(e) => setPrompt(e.target.value)} rows={4} className="glass-input w-full rounded-xl px-4 py-3 focus:outline-none resize-none text-sm" /></div>
                <div className="flex gap-3 pt-2">
                  {initialData && <Button type="button" variant="danger" onClick={() => { if(confirm('Delete?')) { onDelete(initialData.id); onClose(); } }} className="w-12 px-0"><Trash2 size={20} /></Button>}
                  <Button type="submit" fullWidth disabled={isSaving}>{isSaving ? <Loader2 className="animate-spin" size={18} /> : (initialData ? 'Update Vault' : 'Save to Vault')}</Button>
                </div>
              </form>
            </div>
          </div>
        );
      };

      const FullView = ({ data, isOwner, onBack, onEdit }) => {
        const [copied, setCopied] = useState(false);
        const { addToast } = useToast();
        const handleCopy = () => {
          navigator.clipboard.writeText(data.prompt);
          setCopied(true);
          addToast("Prompt copied!");
          setTimeout(() => setCopied(false), 2000);
        };

        const getDotColor = (c) => {
          if (c === 'NanoBanana') return 'bg-[#FFD700]';
          if (c === 'Midjourney') return 'bg-[#00BFFF]';
          return 'bg-[#00FA9A]';
        };

        return (
          <div data-lenis-prevent className="fixed inset-0 z-[100] bg-black text-white overflow-y-auto">
             <div className="fixed top-0 left-0 right-0 z-50 px-4 md:px-8 flex items-center justify-between pt-[calc(0.75rem+env(safe-area-inset-top))] h-[72px] md:h-[88px] pointer-events-none">
                <button onClick={onBack} className="pointer-events-auto group glass-element p-2.5 rounded-xl border border-white/5"><ChevronLeft size={22} /></button>
                <div className="flex items-center gap-2 pointer-events-auto">
                  {isOwner && <button onClick={onEdit} className="glass-element p-2.5 rounded-xl border border-white/5"><Pencil size={18} /></button>}
                </div>
             </div>
             <div className="max-w-xl mx-auto px-4 pb-48 pt-6 flex flex-col items-center w-full">
                <div className="relative w-full aspect-[4/5] rounded-[32px] overflow-hidden bg-[#111] border border-white/10 shadow-2xl mb-8">
                  <img src={data.imageUrl} className="w-full h-full object-cover animate-in fade-in zoom-in-95 duration-700" />
                </div>
                <div className="w-full flex flex-col items-start gap-4">
                   <h1 className="text-2xl md:text-4xl font-black font-display text-white tracking-tight leading-[1.1]">{data.title}</h1>
                   
                   <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black border border-white/10 self-start">
                      <div className={`w-1.5 h-1.5 rounded-full ${getDotColor(data.category)}`}></div>
                      <span className="text-[10px] font-black uppercase tracking-widest text-white">{data.category}</span>
                   </div>

                   <div className="w-full bg-[#151515] border border-white/5 rounded-[28px] p-6 md:p-10 mt-2 relative overflow-hidden group/box">
                      <p className="text-sm md:text-lg text-white font-medium leading-relaxed break-all select-text whitespace-pre-wrap">{data.prompt}</p>
                   </div>
                </div>
             </div>
             <div className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black via-black/90 to-transparent z-50 flex justify-center">
                <button 
                  onClick={handleCopy} 
                  className="w-full max-w-xl bg-[#5b7da0] hover:bg-[#6c8ab0] text-white font-bold py-4 rounded-full transition-all active:scale-[0.98] shadow-2xl text-lg md:text-xl"
                >
                  {copied ? 'Copied!' : 'Copy prompt'}
                </button>
             </div>
          </div>
        );
      };

      const MainApp = () => {
        const [prompts, setPrompts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [dbError, setDbError] = useState(null);
        const [selectedPrompt, setSelectedPrompt] = useState(null);
        const [isAddModalOpen, setIsAddModalOpen] = useState(false);
        const [editingPrompt, setEditingPrompt] = useState(null);
        const [activeCategory, setActiveCategory] = useState('Home');
        const [searchQuery, setSearchQuery] = useState('');
        const [view, setView] = useState('gallery');
        const { addToast } = useToast();

        useEffect(() => {
          const init = async () => {
            setLoading(true);
            const health = await checkDatabaseHealth();
            if (!health.healthy) setDbError(health.error);
            try {
              const data = await fetchPrompts();
              setPrompts(data);
              const hash = window.location.hash;
              if (hash.startsWith('#/view/')) {
                const found = data.find(p => p.id === hash.split('#/view/')[1]);
                if (found) { setSelectedPrompt(found); setView('full'); }
              } else if (hash.startsWith('#/share/')) {
                const decoded = decodeShareData(hash.split('#/share/')[1]);
                if (decoded) { setSelectedPrompt(decoded); setView('shared'); }
              }
            } catch (err) { console.error(err); } finally { setLoading(false); }
          };
          init();

          const lenis = new Lenis({ duration: 1.2, smoothWheel: true });
          function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
          requestAnimationFrame(raf);
          return () => lenis.destroy();
        }, []);

        const handleSave = async (data, file) => {
          let finalUrl = data.imageUrl;
          if (file) finalUrl = await uploadImageToSupabase(file);
          await savePromptToSupabase({ ...data, imageUrl: finalUrl });
          setPrompts(await fetchPrompts());
        };

        const handleDelete = async (id) => {
          await deletePromptFromSupabase(id);
          setPrompts(await fetchPrompts());
        };

        const filtered = prompts.filter(p => (activeCategory === 'Home' || p.category === activeCategory) && (p.title.toLowerCase().includes(searchQuery.toLowerCase())));
        const themeColors = { 'Home': '#547EAE', 'NanoBanana': '#FFD700', 'Midjourney': '#00BFFF', 'Seedream': '#00FA9A' };
        const currentTheme = themeColors[activeCategory] || '#547EAE';

        return (
          <div className="min-h-screen relative text-white selection:bg-[#547EAE] selection:text-black flex flex-col">
            <RepairModal isOpen={!!dbError} onClose={() => setDbError(null)} errorMsg={dbError} />
            <div className="fixed inset-0 z-[-1] bg-[#020202]">
              <div className="absolute top-[-20%] left-[-20%] w-[80vw] h-[80vw] blur-[120px] opacity-[0.04]" style={{ backgroundColor: currentTheme }} />
            </div>

            {view === 'gallery' ? (
              <>
                <header className="fixed top-0 left-0 right-0 z-40 flex justify-center pointer-events-none px-4 pt-6">
                  <div className="pointer-events-auto w-full max-w-6xl bg-black/40 backdrop-blur-[32px] border border-white/10 shadow-2xl rounded-full py-2 px-2 flex items-center justify-between">
                    <div className="flex-1 flex items-center justify-start gap-2.5 pl-3">
                      <img src="./logo.svg" className="w-8 h-8" alt="Logo" />
                      <h1 className="hidden lg:block text-lg font-extrabold tracking-tighter" style={{ fontFamily: 'Slackey' }}>Wavy<span style={{ color: '#547EAE' }}>Prompts</span></h1>
                    </div>
                    <nav className="flex items-center gap-1 overflow-x-auto no-scrollbar px-2">
                      {['Home', 'NanoBanana', 'Midjourney', 'Seedream'].map(cat => (
                        <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-3 py-1.5 rounded-full text-[12px] font-black uppercase tracking-widest transition-all ${activeCategory === cat ? 'text-black' : 'text-white/40 hover:text-white'}`} style={activeCategory === cat ? { backgroundColor: currentTheme } : {}}>{cat}</button>
                      ))}
                    </nav>
                    <div className="flex-1 flex items-center justify-end pr-1">
                      <button onClick={() => { setEditingPrompt(null); setIsAddModalOpen(true); }} className="flex items-center gap-1.5 px-4 py-2 rounded-full bg-white text-black font-black text-[12px] uppercase tracking-wider hover:bg-[#547EAE] hover:text-white transition-all">
                        <Plus size={14} strokeWidth={3} /><span className="hidden md:inline">ADD PROMPT</span><span className="md:hidden">ADD</span>
                      </button>
                    </div>
                  </div>
                </header>

                <main className="pt-24 pb-20 px-4 md:px-8 max-w-7xl mx-auto z-10 relative flex-1">
                  <HeroSection prompts={prompts} />
                  <div className="mb-12 max-w-xl mx-auto w-full relative group">
                      <Search size={16} className="absolute left-4 top-4 text-white/20 group-focus-within:text-[#547EAE] transition-colors" />
                      <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search the vault..." className="w-full bg-white/5 border border-white/10 text-white rounded-full pl-11 pr-4 py-4 text-sm focus:outline-none focus:bg-white/10 focus:ring-2 ring-[#547EAE]/30 transition-all shadow-lg" />
                  </div>

                  {loading ? (
                    <div className="flex flex-col items-center justify-center py-20"><Loader2 size={40} className="animate-spin mb-4" style={{ color: currentTheme }} /></div>
                  ) : filtered.length === 0 ? (
                    <div className="text-center py-20 opacity-30 text-lg font-black uppercase tracking-widest">Vault Empty</div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                      {filtered.map((p) => (
                        <PromptCard 
                          key={p.id} 
                          data={p} 
                          onClick={() => { window.location.hash = `#/view/${p.id}`; setSelectedPrompt(p); setView('full'); }} 
                          onEdit={() => { setEditingPrompt(p); setIsAddModalOpen(true); }} 
                        />
                      ))}
                    </div>
                  )}
                </main>
                
                <footer className="w-full py-12 px-4 md:px-8 border-t border-white/5 mt-auto bg-black/20">
                  <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 opacity-30 grayscale hover:opacity-100 hover:grayscale-0 transition-all duration-500">
                    <div className="flex items-center gap-3">
                      <img src="./logo.svg" className="w-5 h-5" alt="" />
                      <span className="text-[10px] font-black tracking-[0.2em] uppercase font-display">WavyPrompts Vault</span>
                    </div>
                    <div className="text-[9px] font-medium tracking-widest uppercase flex gap-4">
                      <span>© 2025 ALL RIGHTS RESERVED</span>
                      <span className="hidden md:inline">•</span>
                      <span>KEEP IT WAVY</span>
                    </div>
                  </div>
                </footer>

                <AddModal isOpen={isAddModalOpen} onClose={() => setIsAddModalOpen(false)} onSave={handleSave} onDelete={handleDelete} initialData={editingPrompt} />
              </>
            ) : (
              <FullView data={selectedPrompt} isOwner={view==='full'} onBack={() => { window.location.hash = ''; setView('gallery'); }} onEdit={() => { setEditingPrompt(selectedPrompt); setIsAddModalOpen(true); }} />
            )}
          </div>
        );
      };

      const RepairModal = ({ isOpen, onClose, errorMsg }) => {
        if (!isOpen) return null;
        return (
          <div className="fixed inset-0 z-[250] flex items-center justify-center p-4">
            <div className="absolute inset-0 bg-black/90 backdrop-blur-sm" />
            <div className="glass-panel w-full max-w-xl rounded-3xl p-8 relative border border-red-500/20">
              <div className="flex items-center gap-4 mb-6">
                <Database className="text-red-400" size={24} />
                <h2 className="text-xl font-bold font-display uppercase tracking-tight">Database Fix Required</h2>
              </div>
              <p className="text-white/60 text-sm mb-4">Run this SQL in your Supabase Editor:</p>
              <pre className="bg-black/50 p-4 rounded-xl text-[10px] font-mono overflow-auto h-48 border border-white/5 mb-6">{REPAIR_SQL}</pre>
              <div className="flex justify-end gap-3">
                <Button onClick={() => navigator.clipboard.writeText(REPAIR_SQL)} variant="secondary" className="px-4 py-2 text-xs">Copy SQL</Button>
                <Button onClick={() => window.location.reload()} className="px-4 py-2 text-xs">Reload App</Button>
              </div>
            </div>
          </div>
        );
      };

      const App = () => (<ToastProvider><MainApp /></ToastProvider>);
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
  (function () {
    const wall = document.getElementById("coming-wall");

    function updateWall() {
      const isAdmin = localStorage.getItem("wavy_admin") === "1";
      const hash = window.location.hash || "";
      const isSharedLink = hash.startsWith("#/share/");

      if (isAdmin || isSharedLink) {
        wall.style.display = "none";
      } else {
        wall.style.display = "flex";
      }
    }

    // Run immediately
    updateWall();

    // Run again whenever hash changes (CRITICAL)
    window.addEventListener("hashchange", updateWall);
  })();
</script>



  </body>
</html>
